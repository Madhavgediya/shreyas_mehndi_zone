<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="500" height="600" fill="none">
  <!-- Flowing Arabic Vine Mehndi Overlay -->
  <g stroke="#6B3E26" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main stem curve -->
    <path d="M120 540 C180 460, 160 380, 240 320 C320 260, 280 180, 360 80" stroke-width="4.5"/>
    <path d="M130 550 C190 470, 170 390, 250 330 C330 270, 290 190, 370 90" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- Bottom Palm Flower cluster -->
    <circle cx="160" cy="440" r="18" fill="#6B3E26"/>
    <circle cx="160" cy="440" r="28" stroke-width="2"/>
    <path d="M160 410 Q180 390 190 415 Q200 440 180 450 Q160 460 140 450 Q120 440 130 415 Q140 390 160 410 Z" fill="#6B3E26" fill-opacity="0.3"/>
    
    <!-- Big Shaded Arabic Rose -->
    <g transform="translate(240, 300)">
      <circle cx="0" cy="0" r="22" fill="#6B3E26"/>
      <!-- Petals around -->
      <path d="M0 -22 C15 -45, 45 -25, 22 0" fill="#6B3E26" fill-opacity="0.4" stroke-width="3"/>
      <path d="M22 0 C45 15, 25 45, 0 22" fill="#6B3E26" fill-opacity="0.4" stroke-width="3"/>
      <path d="M0 22 C-15 45, -45 25, -22 0" fill="#6B3E26" fill-opacity="0.4" stroke-width="3"/>
      <path d="M-22 0 C-45 -15, -25 -45, 0 -22" fill="#6B3E26" fill-opacity="0.4" stroke-width="3"/>
      <!-- Outer leaf swirls -->
      <path d="M25 -30 C60 -60, 80 -10, 45 10" fill="#6B3E26" fill-opacity="0.25" stroke-width="2.5"/>
      <path d="M-25 30 C-60 60, -80 10, -45 -10" fill="#6B3E26" fill-opacity="0.25" stroke-width="2.5"/>
    </g>

    <!-- Mid Leaf Cascades -->
    <path d="M260 250 C300 220, 310 260, 270 270 Z" fill="#6B3E26" fill-opacity="0.6"/>
    <path d="M210 350 C170 380, 160 340, 200 330 Z" fill="#6B3E26" fill-opacity="0.6"/>

    <!-- Upper Index Finger Rosebud -->
    <g transform="translate(350, 110)">
      <circle cx="0" cy="0" r="14" fill="#6B3E26"/>
      <path d="M0 -14 C12 -28, 28 -12, 14 0" fill="#6B3E26" fill-opacity="0.4" stroke-width="2.5"/>
      <path d="M14 0 C28 12, 12 28, 0 14" fill="#6B3E26" fill-opacity="0.4" stroke-width="2.5"/>
      <path d="M0 14 C-12 28, -28 12, -14 0" fill="#6B3E26" fill-opacity="0.4" stroke-width="2.5"/>
      <path d="M-14 0 C-28 -12, -12 -28, 0 -14" fill="#6B3E26" fill-opacity="0.4" stroke-width="2.5"/>
    </g>

    <!-- Trailing dots to fingertip -->
    <circle cx="365" cy="70" r="6" fill="#6B3E26"/>
    <circle cx="375" cy="50" r="4.5" fill="#6B3E26"/>
    <circle cx="382" cy="35" r="3" fill="#6B3E26"/>
    <circle cx="388" cy="22" r="2" fill="#6B3E26"/>
  </g>
</svg>
