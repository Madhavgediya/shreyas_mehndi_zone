    <circle cx="250" cy="250" r="110" stroke-width="3"/>
    <circle cx="250" cy="250" r="120" stroke-width="1.5" stroke-dasharray="5 4"/>
    
    <!-- 8 Radiating Paisley Leaves -->
    <path d="M250 130 C270 90, 310 95, 290 135 C275 160, 250 150, 250 130 Z" fill="#6B3E26" fill-opacity="0.5"/>
    <path d="M250 370 C270 410, 310 405, 290 365 C275 340, 250 350, 250 370 Z" fill="#6B3E26" fill-opacity="0.5"/>
    <path d="M130 250 C90 270, 95 310, 135 290 C160 275, 150 250, 130 250 Z" fill="#6B3E26" fill-opacity="0.5"/>
    <path d="M370 250 C410 270, 405 310, 365 290 C340 275, 350 250, 370 250 Z" fill="#6B3E26" fill-opacity="0.5"/>
    
    <path d="M165 165 C140 130, 160 100, 185 135 C200 155, 185 175, 165 165 Z" fill="#6B3E26" fill-opacity="0.5"/>
    <path d="M335 165 C360 130, 340 100, 315 135 C300 155, 315 175, 335 165 Z" fill="#6B3E26" fill-opacity="0.5"/>
    <path d="M165 335 C140 370, 160 400, 185 365 C200 345, 185 325, 165 335 Z" fill="#6B3E26" fill-opacity="0.5"/>
    <path d="M335 335 C360 370, 340 400, 315 365 C300 345, 315 325, 335 335 Z" fill="#6B3E26" fill-opacity="0.5"/>

    <!-- Pearl Beads Ring -->
    <circle cx="250" cy="80" r="5" fill="#6B3E26"/>
    <circle cx="250" cy="420" r="5" fill="#6B3E26"/>
    <circle cx="80" cy="250" r="5" fill="#6B3E26"/>
    <circle cx="420" cy="250" r="5" fill="#6B3E26"/>
